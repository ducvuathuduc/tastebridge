name: Deploy

# Deploys the Worker API and the Pages frontend. Requires repository secrets
# CLOUDFLARE_API_TOKEN (Workers Scripts + Pages edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    if: ${{ github.repository == 'ducvuathuduc/tastebridge' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Worker API
        working-directory: worker
        run: |
          npm ci
          npx wrangler deploy
      - name: Build & deploy Pages
        run: |
          npm ci
          VITE_API_BASE=https://tastebridge-api.huynhthanh.workers.dev npm run build
          npx --prefix worker wrangler pages deploy dist --project-name tastebridge --branch main
